name: Build Noir for Mac

# Push a tag like v1.0.0 to build, sign, notarize and publish a release.
# "Run workflow" on the Actions tab makes a signed test build without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check secrets (prints no secret values)
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.MAC_CERT_PASSWORD }}
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "Lengths: p12=${#P12} pass=${#P12_PASS} p8=${#P8} keyid=${#KEY_ID} issuer=${#ISSUER}"
          [ -z "$P12" ] && echo "::error::MAC_CERT_P12_BASE64 missing"
          [ -z "$P12_PASS" ] && echo "::error::MAC_CERT_PASSWORD missing"
          [ -z "$P8" ] && echo "::error::APPLE_API_KEY_P8 missing"
          [ -z "$KEY_ID" ] && echo "::error::APPLE_API_KEY_ID missing"
          [ -z "$ISSUER" ] && echo "::error::APPLE_API_ISSUER missing"
          echo "$P8" | grep -q "BEGIN PRIVATE KEY" || echo "::error::APPLE_API_KEY_P8 does not look like a .p8 file (no BEGIN PRIVATE KEY line)"
          echo "$P12" | tr -d ' \n\r' | base64 -D > /tmp/cert.p12 2>/dev/null || echo "::error::MAC_CERT_P12_BASE64 is not valid base64"
          security create-keychain -p tmp /tmp/check.keychain
          if security import /tmp/cert.p12 -k /tmp/check.keychain -P "$P12_PASS" -A >/dev/null 2>&1; then
            echo "Certificate opened with the password."
            ids=$(security find-identity -v -p codesigning /tmp/check.keychain)
            echo "$ids"
            echo "$ids" | grep -q "Developer ID Application" || echo "::error::The .p12 has no 'Developer ID Application' identity. Export that certificate (with its private key) from Keychain."
          else
            echo "::error::Could not open the .p12. Either MAC_CERT_PASSWORD is wrong, or the base64 got cut off when pasting."
          fi
          security delete-keychain /tmp/check.keychain; rm -f /tmp/cert.p12

      - name: Save the App Store Connect API key for notarizing
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

      - name: Build, sign and notarize
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export APPLE_API_KEY=~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          if [ "${{ github.event_name }}" = "push" ]; then PUB=always; else PUB=never; fi
          set -o pipefail
          if ! npx electron-builder --mac --publish $PUB 2>&1 | tee /tmp/build.log; then
            # Surface the end of the log as annotations so it is readable without opening the log.
            grep -v '^\s*$' /tmp/build.log | tail -15 | sed 's/[^[:print:]]//g' | while IFS= read -r l; do echo "::error::${l:0:400}"; done
            exit 1
          fi

      - name: Keep the test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Noir-mac
          path: dist/Noir.dmg
